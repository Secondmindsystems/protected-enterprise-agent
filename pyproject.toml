[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "protected-enterprise-agent"
version = "0.1.0"
description = "Public-safe protected RAG challenge prototype using Protegrity Developer Edition boundaries."
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = []

[project.scripts]
pea-demo = "protected_enterprise_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

